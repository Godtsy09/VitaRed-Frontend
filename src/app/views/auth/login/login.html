<app-header></app-header>
<section class="login-container">
  <div class="login-card">
    <header class="login-header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder a la plataforma VitaRed</p>
    </header>

    @if (error()) {
      <div class="alert alert-error" role="alert">
        {{ error() }}
      </div>
    }

    <form class="login-form" (ngSubmit)="onLogin()" novalidate>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="ejemplo@vitared.com"
          required
          [(ngModel)]="email"
          name="email"
          [disabled]="loading()"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
          [(ngModel)]="password"
          name="password"
          [disabled]="loading()"
          autocomplete="current-password"
        />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" [disabled]="loading()" />
          <span>Recordarme</span>
        </label>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span> Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <footer class="login-footer">
      <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </footer>
  </div>
</section>

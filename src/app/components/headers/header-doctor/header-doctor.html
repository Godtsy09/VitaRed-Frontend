<header class="header">
  <div class="header-container">
    <!-- Marca VitaRed -->
    <a routerLink="/scheduledAppointments" class="brand">VitaRed</a>

    <!-- Navegación y Perfil del Doctor -->
    <div class="header-right">
      <nav class="nav" aria-label="Navegación de Doctor">
        <a routerLink="/scheduledAppointments" routerLinkActive="active" class="nav-link">Citas Programadas</a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-link">Mi Perfil</a>
      </nav>

      <div class="profile">
        <span class="doctor-name">{{ userName() }}</span>
        
        <div class="avatar-menu">
          <button
            class="avatar"
            type="button"
            aria-label="Menú de doctor"
            (click)="$event.stopPropagation()"
          >
            {{ getInitials() }}
          </button>

          <!-- Menú Desplegable (Visual) -->
          <div class="avatar-dropdown" role="menu">
            <button class="avatar-dropdown-item" type="button" role="menuitem" routerLink="/profile">Ver mi perfil</button>
            <button class="avatar-dropdown-item danger" type="button" role="menuitem" (click)="onLogout()">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
